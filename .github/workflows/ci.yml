name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: formatting pipe contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pipe contract
        run: |
          echo '{"headers":["demo","dur"],"rows":[["bfcache","4.9s"]]}' \
            | node packages/formatting/bin/formatting.js | tee /tmp/fmt.out
          if grep -q $'\x1b' /tmp/fmt.out; then echo "ANSI leaked into piped output" >&2; exit 1; fi

  runner:
    name: bench-runner self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: contract self-test
        run: |
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          mkdir -p "$d/ok" "$d/fail" "$d/silent"
          cat > "$d/ok/bench.js" <<'EOF'
          console.log("RESULT_JSON {\"demo\":\"ok\",\"durationMs\":1,\"headline\":\"fine\"}")
          EOF
          cat > "$d/fail/bench.js" <<'EOF'
          process.exit(1)
          EOF
          cat > "$d/silent/bench.js" <<'EOF'
          console.log("no result here")
          EOF
          node packages/bench-runner/run.js "$d" --json | tee /tmp/res.json
          node -e '
            const r = require("/tmp/res.json");
            if (r.length !== 3) { console.error("expected 3 results, got " + r.length); process.exit(1); }
            // findDemos sorts alphabetically — assert by demo name, not index
            const by = Object.fromEntries(r.map((x) => [x.demo, x.status]));
            if (by.ok !== "ok") { console.error("ok demo not ok: " + JSON.stringify(r)); process.exit(1); }
            if (by.fail !== "FAILED (exit 1)") { console.error("fail demo not failed: " + JSON.stringify(r)); process.exit(1); }
            console.log("bench-runner contract ok")'

  benchmarks:
    name: benchmarks regression subset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: system chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser >/dev/null 2>&1 || sudo apt-get install -y -qq chromium
      - name: npm ci
        run: npm ci --workspace packages/benchmarks
      - name: run subset
        run: node packages/bench-runner/run.js packages/benchmarks --json --only bfcache,cpu-burn
        timeout-minutes: 10

  stateless_inference:
    name: stateless inference runner contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: run stateless-inference via monorepo bench-runner
        run: |
          set -o pipefail
          node packages/bench-runner/run.js packages/benchmarks --only stateless-inference | tee "$RUNNER_TEMP/stateless-inference.log"
          grep -q 'delta 4096 avoided' "$RUNNER_TEMP/stateless-inference.log"
        timeout-minutes: 5

  webshell:
    name: webshell boot + endpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: boot and probe
        run: |
          node packages/webshell/webshell.js --port 8123 & WS=$!
          trap 'kill $WS 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8123/health >/dev/null 2>&1 && break; sleep 0.3; done
          curl -sf http://127.0.0.1:8123/health | grep -q '"status": "ok"'
          curl -sf http://127.0.0.1:8123/apps | grep -q 'bench-runner'

  ticket:
    name: ticket flow self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: state machine + action tests
        run: npm test
      - name: contract probe
        run: |
          node -e 'const f=require("./packages/ticket/lib/flow.js");
            const bad=f.checkTransition("triage","ready",{issue:{labels:[],body:""}});
            const good=f.checkTransition("triage","ready",{issue:{labels:[{name:"type/feature"},{name:"priority/p2"}],body:"### Acceptance criteria\n- [ ] x"}});
            if(bad.ok) { console.error("triage gate accepted an untyped ticket"); process.exit(1) }
            if(!good.ok) { console.error("triage gate rejected a typed ticket: "+good.reason); process.exit(1) }
            console.log("ticket flow contract ok")'
