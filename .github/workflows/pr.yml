name: pr-reconcile
on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  reconcile:
    name: reconcile merged PRs with issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run pr-reconcile (issue #13 spec: stateless-actions)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node packages/ticket/actions/pr-reconcile.js
