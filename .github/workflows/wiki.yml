name: wiki
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: auto wiki update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sync docs → wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC="${GITHUB_WORKSPACE}/docs"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "16064504+grave0x@users.noreply.github.com"

          # The wiki is a derived mirror — the docs tree is the source of truth.
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          git clone -q --depth 1 "$WIKI_URL" "$tmp/wiki"
          cd "$tmp/wiki"

          # wipe previous mirror, rebuild from docs/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p specs adr
          cp -r "$SRC/wiki/." .
          [ -f index.md ] && mv -f index.md Home.md
          cp "$SRC/architecture.md" . 2>/dev/null || true
          cp -r "$SRC/specs/." specs/
          cp -r "$SRC/adr/." adr/

          # rewrite docs-relative links to wiki-relative (mirror structure)
          find . -name '*.md' -exec sed -i \
            's#docs/specs/projects/#specs/projects/#g; s#docs/specs/#specs/#g; s#docs/adr/#adr/#g; s#docs/wiki/#./#g; s#docs/architecture\.md#architecture.md#g' {} +

          # navigation sidebar ([[Page]] wiki links)
          {
            echo "- [[Home]]"
            for f in $(find . -maxdepth 1 -name '*.md' ! -name Home.md ! -name Sidebar.md | sort); do
              echo "- [[$(basename "$f" .md)]]"
            done
            echo "- **Specs**"
            for f in $(find specs -name '*.md' | sort); do
              echo "  - [[${f%.md}]]"
            done
          } > Sidebar.md

          if git status --porcelain | grep -q .; then
            git add -A
            git commit -q -m "docs: sync wiki from docs/ ($GITHUB_SHA)"
            git push -q origin HEAD
            echo "wiki updated ($(find . -name '*.md' | wc -l) pages)"
          else
            echo "wiki already up to date"
          fi
